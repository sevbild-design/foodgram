volumes:
  pg_data:
  static:
  media:
  frontend:
services:
  db:
    image: postgres:13
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKER_USERNAME}/foodgram_backend:latest
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # - static:/backend_static
      - static:/app/collected_static
      - media:/app/media

    expose:
      - "8000"

  frontend:
    image: ${DOCKER_USERNAME}/foodgram_frontend:latest
    volumes:
      - frontend:/frontend_static
  gateway:
    image: ${DOCKER_USERNAME}/foodgram_gateway:latest
    restart: always
    depends_on:
      - backend
      - frontend

    ports:
      - "8000:80"

    volumes:
      - frontend:/usr/share/nginx/html:ro
      - static:/var/html/static:ro
      - media:/var/html/media:ro
