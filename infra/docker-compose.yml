volumes:
  pg_data:
  static:
  media:
  frontend:
services:
  db:
    image: postgres:13
    env_file:
      - ../.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: ./backend/Dockerfile
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    command:
      - /bin/sh
      - -c
      - python manage.py migrate && python manage.py collectstatic --noinput && python manage.py import_ingredients && exec gunicorn --bind 0.0.0.0:8000 foodgram.wsgi:application
    volumes:
      - static:/app/collected_static
      - media:/app/media
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
    volumes:
      - frontend:/frontend_static
  nginx:
    build: .

    depends_on:
      - backend
      - frontend

    ports:
      - "80:80"

    volumes:
      - frontend:/usr/share/nginx/html:ro
      - static:/var/html/static:ro
      - media:/var/html/media:ro
      - ../docs:/var/html/docs:ro
